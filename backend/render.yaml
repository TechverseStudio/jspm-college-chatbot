services:
  - type: web
    name: jspm-college-chatbot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.ingestion
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_API_KEY
        value: jspm_admin_secret_key_2026
